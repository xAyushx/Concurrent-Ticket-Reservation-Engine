services:
  mysql:
    image: mysql:8.0
    command: >
      --default-time-zone=+00:00
      --innodb-lock-wait-timeout=5
    environment:
      MYSQL_ROOT_PASSWORD: root_pw
      MYSQL_DATABASE: ticketing
      MYSQL_USER: ticket
      MYSQL_PASSWORD: ticket_pw
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

volumes:
  mysql_data: